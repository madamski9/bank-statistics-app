<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>BankStats App Store header</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    overflow: hidden;
    background: #0b0b0b;
  }

  .layer {
    position: absolute;
    inset: 0;
  }

  .chart {
    position: absolute;
    top: 0;
    left: 0;
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 77, 87, 0.24), rgba(255, 77, 87, 0.06) 55%, transparent);
  }

  .shade {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to bottom, rgba(11, 11, 11, 0), rgba(11, 11, 11, 0.85));
  }

  #scene {
    position: absolute;
    top: 0;
    left: 0;
  }
</style>
</head>
<body>
<div class="layer" id="background"></div>
<canvas id="scene"></canvas>
<div class="shade" id="shade"></div>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
</script>
<script type="module">
  import { neonLine, renderPhones } from '/app-store/phone-scene.js';

  const [width, height] = (new URLSearchParams(location.search).get('size') ?? '5244x2950').split('x').map(Number);
  const center = width / 2;
  const unit = Math.min(height / 2950, width / 5244);

  document.body.style.width = `${width}px`;
  document.body.style.height = `${height}px`;
  const canvas = document.getElementById('scene');
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  document.getElementById('shade').style.height = `${height * 0.28}px`;

  const background = document.getElementById('background');
  const glow = document.createElement('div');
  glow.className = 'glow';
  const glowSize = height * 1.6;
  Object.assign(glow.style, { width: `${glowSize}px`, height: `${glowSize}px`, left: `${center - glowSize / 2}px`, top: `${height * 0.55 - glowSize / 2}px` });
  background.append(glow);
  background.insertAdjacentHTML(
    'beforeend',
    neonLine({ width, height, baseline: height * 0.74, gridTop: height * 0.2, gridCount: 6, gridStep: height * 0.13 }),
  );

  const phones = [
    { image: 'transactions.png', x: center - 1500 * unit, y: height * 0.6, height: 2500 * unit, rotation: { x: -0.08, y: 0.42, z: 0.1 } },
    { image: 'spending.png', x: center + 1500 * unit, y: height * 0.6, height: 2500 * unit, rotation: { x: -0.08, y: -0.42, z: -0.1 } },
    { image: 'overview.png', x: center, y: height * 0.56, height: 2800 * unit, rotation: { x: -0.08, y: 0, z: 0 } },
  ];

  await renderPhones({ canvas, viewWidth: width, viewHeight: height, fullWidth: width, fullHeight: height, offsetX: 0, phones });
  document.body.dataset.ready = 'true';
</script>
</body>
</html>
