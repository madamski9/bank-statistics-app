<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>BankStats App Store screenshots</title>
<style>
  :root {
    --canvas-width: 1320px;
    --canvas-height: 2868px;
    --background: #f6f3f8;
    --ink: #121014;
    --muted: #5d5864;
    --pink: #ff5c8a;
    --violet: #8b7cf6;
    --green: #3ddc97;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: var(--canvas-width);
    height: var(--canvas-height);
    overflow: hidden;
    background: var(--background);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .canvas {
    position: relative;
    width: var(--canvas-width);
    height: var(--canvas-height);
    overflow: hidden;
    background: var(--background);
  }

  .arc {
    position: absolute;
    border-radius: 50%;
    border-style: solid;
    border-color: transparent;
    background:
      linear-gradient(var(--background), var(--background)) padding-box,
      linear-gradient(135deg, var(--pink), var(--violet)) border-box;
  }

  .arc.soft {
    opacity: 0.18;
  }

  .copy {
    position: absolute;
    left: 96px;
    right: 96px;
    text-align: center;
    z-index: 3;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    padding: 18px 34px;
    border-radius: 999px;
    background: #ffffff;
    box-shadow: 0 12px 40px rgba(60, 30, 80, 0.10);
    color: var(--ink);
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -0.2px;
    margin-bottom: 52px;
  }

  .eyebrow .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--violet));
  }

  h1 {
    color: var(--ink);
    font-size: 116px;
    line-height: 1.04;
    font-weight: 800;
    letter-spacing: -3.5px;
  }

  h1 em {
    font-style: normal;
    background: linear-gradient(120deg, var(--pink), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 40px auto 0;
    max-width: 1000px;
    color: var(--muted);
    font-size: 50px;
    line-height: 1.3;
    font-weight: 500;
    letter-spacing: -0.4px;
  }

  .stage {
    position: absolute;
    inset: 0;
    perspective: 5200px;
    z-index: 2;
  }

  .phone {
    position: absolute;
    width: 1299px;
    height: 2676px;
    padding: 60px;
    border-radius: 232px;
    background: linear-gradient(145deg, #3a3a3e, #0d0d0f 38%, #1c1c1f 70%, #4a4a4f);
    box-shadow:
      inset 0 0 0 6px #2a2a2d,
      inset 0 0 0 10px #050505,
      0 120px 220px rgba(40, 10, 60, 0.30),
      0 40px 80px rgba(40, 10, 60, 0.18);
    transform-origin: top left;
  }

  .screen {
    position: relative;
    width: 1179px;
    height: 2556px;
    border-radius: 172px;
    overflow: hidden;
    background: #000;
  }

  .screen canvas {
    display: block;
    width: 1179px;
    height: 2556px;
  }

  .island {
    position: absolute;
    top: 33px;
    left: 50%;
    width: 378px;
    height: 111px;
    margin-left: -189px;
    border-radius: 999px;
    background: #000;
  }

  .status {
    position: absolute;
    top: 0;
    left: 0;
    width: 1179px;
    height: 150px;
    color: #fff;
  }

  .status .time {
    position: absolute;
    left: 150px;
    top: 56px;
    width: 130px;
    text-align: center;
    font-size: 52px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  .status svg {
    position: absolute;
    top: 66px;
  }

  .features {
    position: absolute;
    left: 110px;
    right: 110px;
    top: 1240px;
    display: grid;
    gap: 56px;
    z-index: 3;
  }

  .feature {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 44px;
    align-items: center;
    padding: 72px 60px;
    border-radius: 72px;
    background: #ffffff;
    box-shadow: 0 30px 80px rgba(60, 30, 80, 0.10);
  }

  .feature .icon {
    width: 150px;
    height: 150px;
    border-radius: 44px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--pink), var(--violet));
  }

  .feature h2 {
    color: var(--ink);
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -1px;
  }

  .feature p {
    margin-top: 12px;
    color: var(--muted);
    font-size: 42px;
    line-height: 1.3;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script>
  const shots = {
    overview: {
      image: 'overview.png',
      eyebrow: { pl: 'Bez logowania do banku', en: 'No bank login' },
      title: { pl: 'Zobacz, na co idą<br><em>Twoje pieniądze</em>', en: 'See where<br><em>your money goes</em>' },
      subtitle: {
        pl: 'Wydatki, wpływy i bilans z powiadomień banku',
        en: 'Spending, income and net flow from bank notifications',
      },
      copyTop: 190,
      phone: { left: 215, top: 1000, scale: 0.64, rotateX: 8, rotateY: -22, rotateZ: -9 },
      arcs: [
        { size: 1500, width: 150, left: -900, top: 1500 },
        { size: 900, width: 110, left: 960, top: 2350 },
      ],
    },
    transactions: {
      image: 'transactions.png',
      title: { pl: 'Płatności<br><em>zapisują się same</em>', en: 'Payments<br><em>save themselves</em>' },
      subtitle: {
        pl: 'Z powiadomień Millennium, PKO BP, ING, mBanku i Portfela Apple',
        en: 'From Millennium, PKO BP, ING, mBank and Apple Wallet notifications',
      },
      copyTop: 200,
      phone: { left: 230, top: 880, scale: 0.665 },
      arcs: [
        { size: 1300, width: 140, left: 860, top: 1100 },
        { size: 1100, width: 120, left: -760, top: 2150 },
      ],
    },
    spending: {
      image: 'spending.png',
      title: { pl: 'Każdy dzień<br><em>na wykresie</em>', en: 'Every day<br><em>on a chart</em>' },
      subtitle: {
        pl: 'Porównanie z poprzednim miesiącem i sklepy, w których wydajesz najwięcej',
        en: 'Compared with last month, with the shops where you spend most',
      },
      copyTop: 200,
      phone: { left: 330, top: 900, scale: 0.68, rotateX: 6, rotateY: 22, rotateZ: 8 },
      arcs: [
        { size: 1600, width: 160, left: 620, top: 1650 },
        { size: 800, width: 100, left: -520, top: 700 },
      ],
    },
    report: {
      image: 'monthly-report.png',
      eyebrow: { pl: 'Premium', en: 'Premium' },
      title: { pl: 'Raport<br><em>na koniec miesiąca</em>', en: 'A report<br><em>every month</em>' },
      subtitle: {
        pl: 'Średnia dzienna i kategorie, na które idzie najwięcej',
        en: 'Your daily average and the categories that cost you most',
      },
      copyTop: 170,
      phone: { left: 230, top: 1000, scale: 0.665 },
      arcs: [
        { size: 1400, width: 140, left: -840, top: 900 },
        { size: 1000, width: 120, left: 820, top: 2200 },
      ],
    },
    limits: {
      image: 'shop-details.png',
      title: { pl: 'Limity, które<br><em>pilnują budżetu</em>', en: 'Limits that<br><em>guard your budget</em>' },
      subtitle: {
        pl: 'Ustaw limit dla sklepu lub kategorii i dostań powiadomienie przed końcem',
        en: 'Set a limit for a shop or a category and get a heads-up before you hit it',
      },
      copyTop: 200,
      phone: { left: 230, top: 1000, scale: 0.665 },
      arcs: [
        { size: 1500, width: 150, left: 700, top: 1500 },
        { size: 900, width: 110, left: -620, top: 520 },
      ],
    },
    privacy: {
      eyebrow: { pl: 'Twoje dane', en: 'Your data' },
      title: { pl: 'Dane zostają<br><em>na Twoim telefonie</em>', en: 'Your data stays<br><em>on your phone</em>' },
      subtitle: {
        pl: 'BankStats nie łączy się z bankiem i nie sprzedaje danych',
        en: 'BankStats never connects to your bank and never sells your data',
      },
      copyTop: 260,
      features: [
        {
          icon: 'lock',
          title: { pl: 'Bez loginu do banku', en: 'No bank login' },
          text: {
            pl: 'Transakcje powstają z powiadomień, które i tak dostajesz.',
            en: 'Transactions come from notifications you already get.',
          },
        },
        {
          icon: 'shield',
          title: { pl: 'Zaszyfrowane na telefonie', en: 'Encrypted on your phone' },
          text: {
            pl: 'Treść powiadomień odczytujemy na urządzeniu. Nigdzie jej nie wysyłamy.',
            en: 'Notifications are read on the device and never sent anywhere.',
          },
        },
        {
          icon: 'export',
          title: { pl: 'Pełna kontrola', en: 'Full control' },
          text: {
            pl: 'Eksport do CSV i JSON, wyłączana synchronizacja i usunięcie konta.',
            en: 'CSV and JSON export, optional sync and account deletion.',
          },
        },
      ],
      arcs: [
        { size: 1500, width: 150, left: -980, top: 2250 },
        { size: 1100, width: 120, left: 1000, top: -700 },
      ],
    },
  };

  const icons = {
    lock: '<svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
    shield: '<svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5V6L12 3z"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/></svg>',
    export: '<svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11"/><path d="M7.5 8L12 3.5 16.5 8"/><path d="M5 13.5v4.5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4.5"/></svg>',
  };

  const statusIcons =
    '<svg style="left:820px" width="78" height="44" viewBox="0 0 78 44"><rect x="0" y="30" width="13" height="14" rx="3" fill="#fff"/><rect x="21" y="21" width="13" height="23" rx="3" fill="#fff"/><rect x="42" y="11" width="13" height="33" rx="3" fill="#fff"/><rect x="63" y="0" width="13" height="44" rx="3" fill="#fff"/></svg>' +
    '<svg style="left:922px" width="64" height="46" viewBox="0 0 24 17"><path d="M12 3.2c3.3 0 6.3 1.3 8.5 3.4l1.6-1.7C19.5 2.4 15.9.9 12 .9S4.5 2.4 1.9 4.9l1.6 1.7C5.7 4.5 8.7 3.2 12 3.2z" fill="#fff"/><path d="M12 7.9c2 0 3.8.8 5.2 2l1.6-1.7C17 6.6 14.6 5.6 12 5.6S7 6.6 5.2 8.2l1.6 1.7c1.4-1.2 3.2-2 5.2-2z" fill="#fff"/><path d="M12 12.4c.8 0 1.6.3 2.2.8L12 15.6l-2.2-2.4c.6-.5 1.4-.8 2.2-.8z" fill="#fff"/></svg>' +
    '<svg style="left:1006px" width="96" height="46" viewBox="0 0 96 46"><rect x="2" y="2" width="82" height="42" rx="13" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="4"/><rect x="9" y="9" width="68" height="28" rx="8" fill="#fff"/><path d="M89 16v14c3.5-1 5.5-3.8 5.5-7s-2-6-5.5-7z" fill="rgba(255,255,255,0.45)"/></svg>';

  const params = new URLSearchParams(location.search);
  const shot = shots[params.get('shot') ?? 'overview'];
  const lang = params.get('lang') === 'en' ? 'en' : 'pl';
  const canvas = document.getElementById('canvas');
  document.documentElement.lang = lang;

  for (const arc of shot.arcs) {
    const element = document.createElement('div');
    element.className = 'arc';
    Object.assign(element.style, {
      width: `${arc.size}px`,
      height: `${arc.size}px`,
      left: `${arc.left}px`,
      top: `${arc.top}px`,
      borderWidth: `${arc.width}px`,
    });
    canvas.append(element);
  }

  const copy = document.createElement('div');
  copy.className = 'copy';
  copy.style.top = `${shot.copyTop}px`;
  copy.innerHTML =
    (shot.eyebrow ? `<div class="eyebrow"><span class="dot"></span>${shot.eyebrow[lang]}</div>` : '') +
    `<h1>${shot.title[lang]}</h1><p class="subtitle">${shot.subtitle[lang]}</p>`;
  canvas.append(copy);

  if (shot.features) {
    const list = document.createElement('div');
    list.className = 'features';
    list.innerHTML = shot.features
      .map(
        (feature) =>
          `<div class="feature"><div class="icon">${icons[feature.icon]}</div><div><h2>${feature.title[lang]}</h2><p>${feature.text[lang]}</p></div></div>`,
      )
      .join('');
    canvas.append(list);
  }

  const statusBarHeight = 150;

  function drawScreen(target, image) {
    const context = target.getContext('2d');
    context.drawImage(image, 0, statusBarHeight + 10, image.width, 1, 0, 0, image.width, statusBarHeight + 10);
    context.drawImage(
      image,
      0,
      statusBarHeight,
      image.width,
      image.height - statusBarHeight,
      0,
      statusBarHeight,
      image.width,
      image.height - statusBarHeight,
    );
  }

  if (shot.image) {
    const stage = document.createElement('div');
    stage.className = 'stage';
    const phone = document.createElement('div');
    phone.className = 'phone';
    const { left, top, scale, rotateX = 0, rotateY = 0, rotateZ = 0 } = shot.phone;
    phone.style.left = `${left}px`;
    phone.style.top = `${top}px`;
    phone.style.transform = `scale(${scale}) rotateX(${rotateX}deg) rotateY(${rotateY}deg) rotateZ(${rotateZ}deg)`;
    phone.innerHTML =
      '<div class="screen"><canvas width="1179" height="2556"></canvas><div class="status"><div class="time">9:41</div>' +
      statusIcons +
      '</div><div class="island"></div></div>';
    stage.append(phone);
    canvas.append(stage);

    const image = new Image();
    image.onload = () => {
      drawScreen(phone.querySelector('canvas'), image);
      document.body.dataset.ready = 'true';
    };
    image.src = `../../website/screenshots/${shot.image}`;
  } else {
    document.body.dataset.ready = 'true';
  }
</script>
</body>
</html>
