<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>BankStats App Store screenshots</title>
<style>
  :root {
    --panel-width: 1320px;
    --panel-height: 2868px;
    --background: #0b0b0b;
    --surface: #141414;
    --text: #f5f5f2;
    --muted: #aaa6a7;
    --line: #2b2728;
    --accent: #ff4d57;
    --accent-warm: #ff8a65;
    --accent-soft: #31171b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: var(--panel-width);
    height: var(--panel-height);
    overflow: hidden;
    background: var(--background);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .panorama {
    position: absolute;
    top: 0;
    left: 0;
    height: var(--panel-height);
    background: var(--background);
  }

  .layer {
    position: absolute;
    inset: 0;
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 77, 87, 0.22), rgba(255, 77, 87, 0.06) 55%, transparent);
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border-style: solid;
    border-color: transparent;
    background:
      linear-gradient(var(--background), var(--background)) padding-box,
      linear-gradient(140deg, var(--accent-warm), var(--accent) 45%, #7a1622) border-box;
  }

  #scene {
    position: absolute;
    top: 0;
    width: var(--panel-width);
    height: var(--panel-height);
  }

  .copy {
    position: absolute;
    width: 1128px;
    text-align: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    padding: 18px 34px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font-size: 40px;
    font-weight: 600;
    margin-bottom: 52px;
  }

  .eyebrow .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 24px var(--accent);
  }

  h1 {
    color: var(--text);
    font-size: 118px;
    line-height: 1.04;
    font-weight: 800;
    letter-spacing: -3.5px;
  }

  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, var(--accent), var(--accent-warm));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 40px auto 0;
    max-width: 1000px;
    color: var(--muted);
    font-size: 50px;
    line-height: 1.3;
    font-weight: 500;
    letter-spacing: -0.4px;
  }

  .features {
    position: absolute;
    width: 1100px;
    display: grid;
    gap: 56px;
  }

  .feature {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 44px;
    align-items: center;
    padding: 72px 60px;
    border: 2px solid var(--line);
    border-radius: 72px;
    background: linear-gradient(115deg, #1e1417, #111011);
  }

  .feature .icon {
    width: 150px;
    height: 150px;
    border-radius: 44px;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .feature h2 {
    color: var(--text);
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -1px;
  }

  .feature p {
    margin-top: 12px;
    color: var(--muted);
    font-size: 42px;
    line-height: 1.3;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="panorama" id="panorama">
  <div class="layer" id="background"></div>
  <canvas id="scene" width="1320" height="2868"></canvas>
  <div class="layer" id="foreground"></div>
</div>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
</script>
<script type="module">
  import {
    AmbientLight,
    BoxGeometry,
    CanvasTexture,
    DirectionalLight,
    ExtrudeGeometry,
    Group,
    Mesh,
    MeshBasicMaterial,
    MeshPhysicalMaterial,
    MeshStandardMaterial,
    PerspectiveCamera,
    PMREMGenerator,
    PointLight,
    Scene,
    Shape,
    ShapeGeometry,
    SRGBColorSpace,
    WebGLRenderer,
  } from 'three';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const panelWidth = 1320;
  const panelHeight = 2868;
  const panelCount = 6;
  const panoramaWidth = panelWidth * panelCount;

  const copy = {
    overview: {
      eyebrow: { pl: 'Bez logowania do banku', en: 'No bank login' },
      title: { pl: 'Zobacz, na co idą<br><em>Twoje pieniądze</em>', en: 'See where<br><em>your money goes</em>' },
      subtitle: { pl: 'Wydatki, wpływy i bilans z powiadomień banku', en: 'Spending, income and net flow from bank notifications' },
    },
    transactions: {
      title: { pl: 'Płatności<br><em>zapisują się same</em>', en: 'Payments<br><em>save themselves</em>' },
      subtitle: {
        pl: 'Z powiadomień Millennium, PKO BP, ING, mBanku i Portfela Apple',
        en: 'From Millennium, PKO BP, ING, mBank and Apple Wallet notifications',
      },
    },
    spending: {
      title: { pl: 'Każdy dzień<br><em>na wykresie</em>', en: 'Every day<br><em>on a chart</em>' },
      subtitle: {
        pl: 'Porównanie z poprzednim miesiącem i sklepy, w których wydajesz najwięcej',
        en: 'Compared with last month, with the shops where you spend most',
      },
    },
    report: {
      eyebrow: { pl: 'Premium', en: 'Premium' },
      title: { pl: 'Raport<br><em>na koniec miesiąca</em>', en: 'A report<br><em>every month</em>' },
      subtitle: {
        pl: 'Średnia dzienna i kategorie, na które idzie najwięcej',
        en: 'Your daily average and the categories that cost you most',
      },
    },
    limits: {
      title: { pl: 'Limity, które<br><em>pilnują budżetu</em>', en: 'Limits that<br><em>guard your budget</em>' },
      subtitle: {
        pl: 'Ustaw limit dla sklepu lub kategorii i dostań powiadomienie przed końcem',
        en: 'Set a limit for a shop or a category and get a heads-up before you hit it',
      },
    },
    privacy: {
      eyebrow: { pl: 'Twoje dane', en: 'Your data' },
      title: { pl: 'Dane zostają<br><em>na Twoim telefonie</em>', en: 'Your data stays<br><em>on your phone</em>' },
      subtitle: {
        pl: 'BankStats nie łączy się z bankiem i nie sprzedaje danych',
        en: 'BankStats never connects to your bank and never sells your data',
      },
    },
  };

  const panels = ['overview', 'transactions', 'spending', 'report', 'limits', 'privacy'];

  const copyTops = { overview: 170, transactions: 200, spending: 200, report: 170, limits: 200, privacy: 260 };

  const phones = [
    { image: 'overview.png', x: 1300, y: 1980, height: 2150, rotation: { x: -0.16, y: 0.52, z: 0.24 } },
    { image: 'transactions.png', x: 2540, y: 1990, height: 1950, rotation: { x: -0.12, y: -0.46, z: -0.2 } },
    { image: 'spending.png', x: 3580, y: 1930, height: 1820, rotation: { x: -0.1, y: 0.36, z: 0.12 } },
    { image: 'monthly-report.png', x: 4620, y: 1900, height: 1880, rotation: { x: -0.06, y: 0.16, z: 0 } },
    { image: 'shop-details.png', x: 5940, y: 1900, height: 1880, rotation: { x: -0.06, y: -0.16, z: 0 } },
  ];

  const rings = [
    { size: 1700, width: 150, left: -1000, top: 1450 },
    { size: 1500, width: 140, left: 1700, top: 1900 },
    { size: 1300, width: 130, left: 2950, top: 2250 },
    { size: 1600, width: 150, left: 4950, top: 1600 },
    { size: 1400, width: 140, left: 6200, top: 2100 },
    { size: 900, width: 110, left: 7500, top: -800 },
  ];

  const glows = [
    { size: 2200, left: 150, top: 900 },
    { size: 2000, left: 1700, top: 1000 },
    { size: 2000, left: 2700, top: 900 },
    { size: 1900, left: 3700, top: 950 },
    { size: 1900, left: 5000, top: 950 },
    { size: 1900, left: 6300, top: 900 },
  ];

  const icons = {
    lock: '<svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
    shield: '<svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5V6L12 3z"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/></svg>',
    export: '<svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11"/><path d="M7.5 8L12 3.5 16.5 8"/><path d="M5 13.5v4.5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4.5"/></svg>',
  };

  const features = [
    {
      icon: 'lock',
      title: { pl: 'Bez loginu do banku', en: 'No bank login' },
      text: { pl: 'Transakcje powstają z powiadomień, które i tak dostajesz.', en: 'Transactions come from notifications you already get.' },
    },
    {
      icon: 'shield',
      title: { pl: 'Zaszyfrowane na telefonie', en: 'Encrypted on your phone' },
      text: {
        pl: 'Treść powiadomień odczytujemy na urządzeniu. Nigdzie jej nie wysyłamy.',
        en: 'Notifications are read on the device and never sent anywhere.',
      },
    },
    {
      icon: 'export',
      title: { pl: 'Pełna kontrola', en: 'Full control' },
      text: {
        pl: 'Eksport do CSV i JSON, wyłączana synchronizacja i usunięcie konta.',
        en: 'CSV and JSON export, optional sync and account deletion.',
      },
    },
  ];

  const params = new URLSearchParams(location.search);
  const lang = params.get('lang') === 'en' ? 'en' : 'pl';
  const panel = Math.min(Math.max(Number(params.get('panel') ?? 0), 0), panelCount - 1);
  document.documentElement.lang = lang;

  const panorama = document.getElementById('panorama');
  panorama.style.width = `${panoramaWidth}px`;
  panorama.style.transform = `translateX(${-panel * panelWidth}px)`;
  document.getElementById('scene').style.left = `${panel * panelWidth}px`;

  const background = document.getElementById('background');
  for (const glow of glows) {
    const element = document.createElement('div');
    element.className = 'glow';
    Object.assign(element.style, { width: `${glow.size}px`, height: `${glow.size}px`, left: `${glow.left}px`, top: `${glow.top}px` });
    background.append(element);
  }
  for (const ring of rings) {
    const element = document.createElement('div');
    element.className = 'ring';
    Object.assign(element.style, {
      width: `${ring.size}px`,
      height: `${ring.size}px`,
      left: `${ring.left}px`,
      top: `${ring.top}px`,
      borderWidth: `${ring.width}px`,
    });
    background.append(element);
  }

  const foreground = document.getElementById('foreground');
  panels.forEach((id, index) => {
    const text = copy[id];
    const element = document.createElement('div');
    element.className = 'copy';
    element.style.left = `${index * panelWidth + 96}px`;
    element.style.top = `${copyTops[id]}px`;
    element.innerHTML =
      (text.eyebrow ? `<div class="eyebrow"><span class="dot"></span>${text.eyebrow[lang]}</div>` : '') +
      `<h1>${text.title[lang]}</h1><p class="subtitle">${text.subtitle[lang]}</p>`;
    foreground.append(element);
  });

  const list = document.createElement('div');
  list.className = 'features';
  list.style.left = `${5 * panelWidth + 110}px`;
  list.style.top = '1180px';
  list.innerHTML = features
    .map(
      (feature) =>
        `<div class="feature"><div class="icon">${icons[feature.icon]}</div><div><h2>${feature.title[lang]}</h2><p>${feature.text[lang]}</p></div></div>`,
    )
    .join('');
  foreground.append(list);

  function roundedRectangle(width, height, radius) {
    const shape = new Shape();
    const left = -width / 2;
    const bottom = -height / 2;
    shape.moveTo(left + radius, bottom);
    shape.lineTo(left + width - radius, bottom);
    shape.quadraticCurveTo(left + width, bottom, left + width, bottom + radius);
    shape.lineTo(left + width, bottom + height - radius);
    shape.quadraticCurveTo(left + width, bottom + height, left + width - radius, bottom + height);
    shape.lineTo(left + radius, bottom + height);
    shape.quadraticCurveTo(left, bottom + height, left, bottom + height - radius);
    shape.lineTo(left, bottom + radius);
    shape.quadraticCurveTo(left, bottom, left + radius, bottom);
    return shape;
  }

  function mappedShapeGeometry(width, height, radius) {
    const geometry = new ShapeGeometry(roundedRectangle(width, height, radius), 24);
    const positions = geometry.attributes.position;
    const uvs = geometry.attributes.uv;
    for (let index = 0; index < positions.count; index += 1) {
      uvs.setXY(index, positions.getX(index) / width + 0.5, positions.getY(index) / height + 0.5);
    }
    uvs.needsUpdate = true;
    return geometry;
  }

  function loadImage(source) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = source;
    });
  }

  const statusBarHeight = 150;

  function drawStatusBar(context) {
    context.fillStyle = '#fff';
    context.font = '600 52px -apple-system, "SF Pro Text", system-ui';
    context.textAlign = 'center';
    context.textBaseline = 'alphabetic';
    context.fillText('9:41', 215, 108);
    [[820, 30, 14], [841, 21, 23], [862, 11, 33], [883, 0, 44]].forEach(([x, offset, height]) => {
      context.beginPath();
      context.roundRect(x, 66 + offset, 13, height, 3);
      context.fill();
    });
    context.save();
    context.translate(922, 66);
    context.scale(64 / 24, 46 / 17);
    context.fill(new Path2D('M12 3.2c3.3 0 6.3 1.3 8.5 3.4l1.6-1.7C19.5 2.4 15.9.9 12 .9S4.5 2.4 1.9 4.9l1.6 1.7C5.7 4.5 8.7 3.2 12 3.2z'));
    context.fill(new Path2D('M12 7.9c2 0 3.8.8 5.2 2l1.6-1.7C17 6.6 14.6 5.6 12 5.6S7 6.6 5.2 8.2l1.6 1.7c1.4-1.2 3.2-2 5.2-2z'));
    context.fill(new Path2D('M12 12.4c.8 0 1.6.3 2.2.8L12 15.6l-2.2-2.4c.6-.5 1.4-.8 2.2-.8z'));
    context.restore();
    context.strokeStyle = 'rgba(255,255,255,0.45)';
    context.lineWidth = 4;
    context.beginPath();
    context.roundRect(1008, 68, 82, 42, 13);
    context.stroke();
    context.beginPath();
    context.roundRect(1015, 75, 68, 28, 8);
    context.fill();
    context.fillStyle = 'rgba(255,255,255,0.45)';
    context.beginPath();
    context.moveTo(1095, 82);
    context.lineTo(1095, 96);
    context.quadraticCurveTo(1101, 89, 1095, 82);
    context.fill();
  }

  function screenCanvas(image) {
    const canvas = document.createElement('canvas');
    canvas.width = image.width;
    canvas.height = image.height;
    const context = canvas.getContext('2d');
    context.drawImage(image, 0, statusBarHeight + 10, image.width, 1, 0, 0, image.width, statusBarHeight + 10);
    context.drawImage(
      image,
      0,
      statusBarHeight,
      image.width,
      image.height - statusBarHeight,
      0,
      statusBarHeight,
      image.width,
      image.height - statusBarHeight,
    );
    drawStatusBar(context);
    return canvas;
  }

  const bodyWidth = 2.55;
  const bodyHeight = 5.47;
  const screenWidth = 2.49;
  const screenHeight = (screenWidth * 2556) / 1179;

  const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(panelWidth, panelHeight, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = SRGBColorSpace;

  const scene = new Scene();
  const generator = new PMREMGenerator(renderer);
  scene.environment = generator.fromScene(new RoomEnvironment(), 0.04).texture;

  const titanium = new MeshPhysicalMaterial({ color: 0x6e6e74, metalness: 1, roughness: 0.24, clearcoat: 0.8, clearcoatRoughness: 0.12 });
  const rimMaterial = new MeshPhysicalMaterial({ color: 0xb4b4ba, metalness: 1, roughness: 0.18, clearcoat: 1 });
  const glassMaterial = new MeshStandardMaterial({ color: 0x030303, metalness: 0.2, roughness: 0.3 });
  const antennaMaterial = new MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.8 });
  const islandMaterial = new MeshBasicMaterial({ color: 0x000000 });

  function createPhone(texture) {
    const device = new Group();
    const body = new Mesh(
      new ExtrudeGeometry(roundedRectangle(bodyWidth, bodyHeight, 0.4), {
        depth: 0.17,
        bevelEnabled: true,
        bevelSize: 0.016,
        bevelThickness: 0.016,
        bevelSegments: 6,
        curveSegments: 24,
      }),
      titanium,
    );
    device.add(body);
    const rim = new Mesh(
      new ExtrudeGeometry(roundedRectangle(bodyWidth, bodyHeight, 0.4), {
        depth: 0.014,
        bevelEnabled: true,
        bevelSize: 0.006,
        bevelThickness: 0.006,
        bevelSegments: 4,
        curveSegments: 24,
      }),
      rimMaterial,
    );
    rim.position.z = 0.19;
    device.add(rim);
    const glass = new Mesh(
      new ExtrudeGeometry(roundedRectangle(bodyWidth - 0.03, bodyHeight - 0.03, 0.385), { depth: 0.006, bevelEnabled: false, curveSegments: 24 }),
      glassMaterial,
    );
    glass.position.z = 0.214;
    device.add(glass);
    const screen = new Mesh(
      mappedShapeGeometry(screenWidth, screenHeight, 0.37),
      new MeshBasicMaterial({ map: texture, toneMapped: false }),
    );
    screen.position.z = 0.24;
    device.add(screen);
    const islandHeight = (111 / 1179) * screenWidth;
    const islandWidth = (378 / 1179) * screenWidth;
    const island = new Mesh(new ShapeGeometry(roundedRectangle(islandWidth, islandHeight, islandHeight / 2), 16), islandMaterial);
    island.position.set(0, screenHeight / 2 - (33 / 1179) * screenWidth - islandHeight / 2, 0.255);
    device.add(island);
    const buttonGeometry = new BoxGeometry(0.05, 0.42, 0.09);
    for (const [side, height, length] of [[-1, 1.42, 0.2], [-1, 0.86, 0.42], [-1, 0.32, 0.42], [1, 0.62, 0.62]]) {
      const button = new Mesh(buttonGeometry, titanium);
      button.scale.y = length / 0.42;
      button.position.set(side * (bodyWidth / 2 + 0.012), height, 0.09);
      device.add(button);
    }
    const antennaGeometry = new BoxGeometry(0.014, 0.04, 0.17);
    for (const side of [-1, 1]) {
      for (const height of [-1.9, 1.9]) {
        const antenna = new Mesh(antennaGeometry, antennaMaterial);
        antenna.position.set(side * (bodyWidth / 2 + 0.002), height, 0.09);
        device.add(antenna);
      }
    }
    return device;
  }

  const fieldOfView = 14;
  const distance = panelHeight / 2 / Math.tan(((fieldOfView / 2) * Math.PI) / 180);
  const camera = new PerspectiveCamera(fieldOfView, panoramaWidth / panelHeight, distance - 3000, distance + 3000);
  camera.position.set(panoramaWidth / 2, -panelHeight / 2, distance);
  camera.setViewOffset(panoramaWidth, panelHeight, panel * panelWidth, 0, panelWidth, panelHeight);

  scene.add(new AmbientLight(0xffffff, 0.5));
  const key = new DirectionalLight(0xffffff, 3);
  key.position.set(-3, 5, 6);
  scene.add(key);
  const fill = new DirectionalLight(0xc8cbdd, 1.2);
  fill.position.set(4, -2, 3);
  scene.add(fill);

  const images = await Promise.all(phones.map((phone) => loadImage(`/website/screenshots/${phone.image}`)));
  phones.forEach((phone, index) => {
    const texture = new CanvasTexture(screenCanvas(images[index]));
    texture.colorSpace = SRGBColorSpace;
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const device = createPhone(texture);
    const scale = phone.height / bodyHeight;
    device.scale.setScalar(scale);
    device.position.set(phone.x, -phone.y, 0);
    device.rotation.set(phone.rotation.x, phone.rotation.y, phone.rotation.z);
    scene.add(device);
    const red = new PointLight(0xff2038, 6, 2600, 1.2);
    red.position.set(phone.x + 900, -phone.y + 200, 900);
    scene.add(red);
  });

  renderer.render(scene, camera);
  document.body.dataset.ready = 'true';
</script>
</body>
</html>
